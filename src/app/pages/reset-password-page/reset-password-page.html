<section aria-label="Página de recuperação de senha" class="section-reset-password">
    <div class="reset-password-container">   

        <h2>Recuperação de Senha</h2>

        <p class="reset-password-subtitle">
            Por favor, insira seu e-mail de usuário
        </p>
    
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="form-container">
            <div class="input-group">
                <input type="email" id="userEmail" class="user-email-class" formControlName="userEmail" placeholder=" " required>
                <label for="userEmail">E-mail</label>
            </div>
    
            <button type="submit" [disabled]="resetPasswordForm.invalid" class="reset-button">Resetar Senha</button>
        </form>
    </div>
</section>
